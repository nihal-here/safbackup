name: Build Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Validate Secrets & Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAFBACKUP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAFBACKUP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAFBACKUP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAFBACKUP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required release signing secrets (SAFBACKUP_KEYSTORE_BASE64, SAFBACKUP_KEYSTORE_PASSWORD, SAFBACKUP_KEY_ALIAS, SAFBACKUP_KEY_PASSWORD) are missing or empty in repository secrets!"
            exit 1
          fi

          KEYSTORE_PATH="${{ runner.temp }}/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to decode SAFBACKUP_KEYSTORE_BASE64 into valid keystore file!"
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SAFBACKUP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAFBACKUP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAFBACKUP_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify Release APK Signature
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Signed release APK not found at $APK_PATH!"
            exit 1
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying APK signature with $APKSIGNER..."
            $APKSIGNER verify --verbose "$APK_PATH"
          else
            echo "apksigner not found, checking APK signature files..."
            unzip -l "$APK_PATH" | grep META-INF
          fi

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAFBackup-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: SAF Backup v0.2.0
          body: "SAF Backup V2 - Permanent Signed Release Build"
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
