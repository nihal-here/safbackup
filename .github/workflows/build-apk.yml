name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # Dev / CI build job for pushes to main & pull requests
  check:
    if: (!startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Run Unit Tests & Build Debug APK
        run: gradle test assembleDebug

  # Official Release Job for Git version tags (e.g. v0.2.1)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Parse & Validate Tag Version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Processing release tag: $TAG"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match required format vMAJOR.MINOR.PATCH (e.g. v0.2.1)"
            exit 1
          fi

          VERSION_NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"

          if [ "$MINOR" -ge 1000 ] || [ "$PATCH" -ge 1000 ]; then
            echo "::error::MINOR ($MINOR) and PATCH ($PATCH) must be less than 1000 for deterministic versionCode calculation."
            exit 1
          fi

          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))

          # Enforce monotonicity > 2 (installed V2 had versionCode 2)
          if [ "$VERSION_CODE" -le 2 ]; then
            echo "::error::Generated versionCode ($VERSION_CODE) must be greater than 2!"
            exit 1
          fi

          echo "Derived versionName: $VERSION_NAME"
          echo "Derived versionCode: $VERSION_CODE"

          echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Validate Secrets & Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAFBACKUP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAFBACKUP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAFBACKUP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAFBACKUP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required release signing secrets (SAFBACKUP_KEYSTORE_BASE64, SAFBACKUP_KEYSTORE_PASSWORD, SAFBACKUP_KEY_ALIAS, SAFBACKUP_KEY_PASSWORD) are missing or empty!"
            exit 1
          fi

          KEYSTORE_PATH="${{ runner.temp }}/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to decode SAFBACKUP_KEYSTORE_BASE64 into valid keystore file!"
            exit 1
          fi

      - name: Run Unit Tests & Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SAFBACKUP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAFBACKUP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAFBACKUP_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: gradle test assembleRelease

      - name: Verify Release APK Signature & Version Badging
        run: |
          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RAW_APK" ]; then
            echo "::error::Signed release APK not found at $RAW_APK!"
            exit 1
          fi

          # 1. Verify Signature with apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying APK signature with $APKSIGNER..."
            $APKSIGNER verify --verbose "$RAW_APK"
          else
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools!"
            exit 1
          fi

          # 2. Verify Package Name, VersionName, and VersionCode inside APK
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -n 1)
          if [ -n "$AAPT" ]; then
            BADGING=$($AAPT dump badging "$RAW_APK")
            echo "APK Badging Output:"
            echo "$BADGING" | grep "package:"

            if ! echo "$BADGING" | grep -q "name='dev.safbackup'"; then
              echo "::error::APK package name does not match dev.safbackup!"
              exit 1
            fi
            if ! echo "$BADGING" | grep -q "versionCode='$APP_VERSION_CODE'"; then
              echo "::error::APK versionCode does not match expected $APP_VERSION_CODE!"
              exit 1
            fi
            if ! echo "$BADGING" | grep -q "versionName='$APP_VERSION_NAME'"; then
              echo "::error::APK versionName does not match expected $APP_VERSION_NAME!"
              exit 1
            fi
            echo "APK Version Verification PASSED!"
          fi

          # 3. Rename APK for Release Upload
          FINAL_APK="app/build/outputs/apk/release/SAFBackup-v${APP_VERSION_NAME}.apk"
          mv "$RAW_APK" "$FINAL_APK"
          echo "FINAL_APK_PATH=$FINAL_APK" >> $GITHUB_ENV

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAFBackup-v${{ env.APP_VERSION_NAME }}-apk
          path: ${{ env.FINAL_APK_PATH }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SAF Backup ${{ github.ref_name }}
          body: "SAF Backup Release ${{ github.ref_name }} — Permanent Signed Build"
          files: ${{ env.FINAL_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
